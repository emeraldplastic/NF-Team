<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NF-Team — Gallery</title>
  <meta name="description" content="Browse, explore, and collect AI-enhanced NFTs from the NF-Team universe. Filter by type, zone, and more." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* ── Gallery page layout ── */
    .gallery-page-body {
      padding-top: var(--nav-height);
    }

    .gallery-section {
      min-height: calc(100vh - var(--nav-height));
      padding: var(--space-xl) var(--space-lg);
    }

    .gallery-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--space-md);
      margin-bottom: var(--space-xl);
    }

    .gallery-search {
      flex: 1;
      min-width: 220px;
      padding: 12px 16px 12px 44px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: var(--radius-full);
      font-family: var(--font-body);
      font-size: 0.9rem;
      color: var(--text-primary);
      outline: none;
      transition: all var(--duration-normal) var(--ease-out);
    }

    .gallery-search:focus {
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 3px rgba(0,249,255,0.1);
      background: rgba(255,255,255,0.06);
    }

    .gallery-search::placeholder {
      color: var(--text-muted);
    }

    .search-wrapper {
      position: relative;
      flex: 1;
      min-width: 220px;
    }

    .search-wrapper::before {
      content: '🔍';
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1rem;
      pointer-events: none;
    }

    .gallery-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .filter-chip {
      padding: 8px 18px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: var(--radius-full);
      font-family: var(--font-body);
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all var(--duration-normal) var(--ease-out);
    }

    .filter-chip:hover {
      background: rgba(255,255,255,0.08);
      color: var(--text-primary);
    }

    .filter-chip.active {
      background: rgba(0,249,255,0.12);
      border-color: rgba(0,249,255,0.3);
      color: var(--accent-primary);
    }

    .gallery-sort {
      padding: 8px 14px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: var(--radius-md);
      font-family: var(--font-body);
      font-size: 0.8rem;
      color: var(--text-secondary);
      cursor: pointer;
      outline: none;
    }

    /* ── NFT Grid ── */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: var(--space-lg);
    }

    .nft-card {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      border: var(--border-subtle);
      border-radius: var(--radius-lg);
      overflow: hidden;
      cursor: pointer;
      transition: all var(--duration-normal) var(--ease-out);
    }

    .nft-card:hover {
      transform: translateY(-6px);
      box-shadow: var(--glass-shadow), 0 12px 40px rgba(0,249,255,0.08);
      border-color: rgba(0,249,255,0.2);
    }

    .nft-card-preview {
      height: 200px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .nft-card-preview .preview-icon {
      font-size: 3rem;
      opacity: 0.6;
    }

    .nft-card-type {
      position: absolute;
      top: 12px;
      right: 12px;
      padding: 4px 12px;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(8px);
      border-radius: var(--radius-full);
      font-family: var(--font-mono);
      font-size: 0.7rem;
      text-transform: uppercase;
      color: var(--text-primary);
      letter-spacing: 0.06em;
    }

    .nft-card-zone-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      padding: 4px 10px;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(8px);
      border-radius: var(--radius-full);
      font-size: 0.7rem;
      color: var(--text-secondary);
    }

    .nft-card-body {
      padding: var(--space-md);
    }

    .nft-card-title {
      font-family: var(--font-heading);
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 4px;
    }

    .nft-card-creator {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .nft-card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-sm) var(--space-md);
      border-top: 1px solid rgba(255,255,255,0.06);
    }

    .nft-card-stats {
      display: flex;
      gap: var(--space-md);
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .nft-card-stats span {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* ── Empty State ── */
    .gallery-empty {
      grid-column: 1 / -1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--space-3xl) var(--space-xl);
      text-align: center;
    }

    .gallery-empty .empty-icon {
      font-size: 4rem;
      margin-bottom: var(--space-md);
      opacity: 0.4;
    }

    .gallery-empty p {
      color: var(--text-muted);
      font-size: 1rem;
      max-width: 400px;
    }

    .gallery-empty .btn {
      margin-top: var(--space-md);
    }

    /* ── Gallery stat bar ── */
    .gallery-stat-bar {
      display: flex;
      gap: var(--space-lg);
      padding: var(--space-md) 0;
      margin-bottom: var(--space-md);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .gallery-stat-bar strong {
      color: var(--text-primary);
    }

    @keyframes nftSpawn {
      from { opacity: 0; transform: scale(0.9) translateY(20px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }

    @media (max-width: 640px) {
      .gallery-toolbar {
        flex-direction: column;
      }
      .gallery-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body class="gallery-page-body">
  <canvas id="particle-bg"></canvas>

  <!-- Navigation -->
  <div id="nav-root"></div>

  <!-- ═══════════════ GALLERY ═══════════════ -->
  <section id="gallery" class="section gallery-section">
    <div class="section-header">
      <h1 class="section-title">NFT <span class="text-gradient">Gallery</span></h1>
      <p class="section-desc">Explore creations from across the universe</p>
    </div>

    <div class="gallery-toolbar">
      <div class="search-wrapper">
        <input type="search" id="gallery-search" class="gallery-search" placeholder="Search NFTs…" aria-label="Search gallery" />
      </div>
      <div class="gallery-filters">
        <button class="filter-chip active" data-filter="all">All</button>
        <button class="filter-chip" data-filter="image">🖼️ Art</button>
        <button class="filter-chip" data-filter="music">🎵 Music</button>
        <button class="filter-chip" data-filter="text">📝 Stories</button>
        <button class="filter-chip" data-filter="mesh">🧊 3D</button>
        <button class="filter-chip" data-filter="fusion">⚡ Fusions</button>
      </div>
      <select class="gallery-sort select" id="gallery-sort" aria-label="Sort gallery">
        <option value="newest">Newest First</option>
        <option value="oldest">Oldest First</option>
        <option value="popular">Most Viewed</option>
        <option value="forked">Most Forked</option>
      </select>
    </div>

    <div class="gallery-stat-bar">
      <span><strong id="gallery-total">0</strong> NFTs</span>
      <span><strong id="gallery-art-count">0</strong> Art</span>
      <span><strong id="gallery-music-count">0</strong> Music</span>
      <span><strong id="gallery-story-count">0</strong> Stories</span>
      <span><strong id="gallery-3d-count">0</strong> 3D</span>
    </div>

    <div id="gallery-grid" class="gallery-grid">
      <div class="gallery-empty">
        <span class="empty-icon">🌌</span>
        <p>The gallery is waiting for your first creation. Head over to the Creation Studio to mint your first NFT!</p>
        <a href="create.html" class="btn btn-primary btn-glow">Start Creating →</a>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <div id="footer-root"></div>

  <!-- Toast -->
  <div id="toast-root"></div>

  <script src="security.js"></script>
  <script src="events.js"></script>
  <script src="store.js"></script>
  <script src="router.js"></script>
  <script src="ui-enhancements.js"></script>
  <script src="shared.js"></script>
  <script src="app.js"></script>
  <script src="pages/gallery.js"></script>
</body>
</html>
